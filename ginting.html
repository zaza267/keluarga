<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keluarga Ginting - Family Site</title>
    <style>
        /* --- 1. GAYA CSS (Soft Coklat Theme & Desain Modern) --- */
        :root {
            --soft-brown: #EADDCA; /* Beige/Coklat Muda Background */
            --medium-brown: #B7A082; /* Coklat Sedang untuk Aksen */
            --dark-brown: #5D4037; /* Coklat Gelap untuk Teks/Header */
            --text-color: #3e2723; /* Warna Teks Utama */
            --transition-speed: 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--soft-brown);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            text-align: center;
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Background Estetik (Ganti URL dengan gambar Anda) --- */
        .page-content {
            /* Placeholder Background: Ganti dengan URL gambar estetik Anda */
            background-image: url('https://images.unsplash.com/photo-1542475147427-4402a11b65e2?fit=crop&w=1500&h=1000'); 
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            padding-top: 60px; 
            transition: transform var(--transition-speed);
        }
        
        /* Gaya saat menu terbuka (menggeser konten) */
        .menu-open .page-content {
            transform: translateX(250px);
        }

        /* --- Header & Sidebar Navigasi --- */
        header {
            background-color: var(--dark-brown);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-start;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 30;
        }

        .menu-icon {
            font-size: 28px;
            cursor: pointer;
            padding: 0 15px;
            line-height: 1;
        }
        
        /* Sidebar Menu Geser (Off-Canvas) */
        #sidebar-menu {
            height: 100%;
            width: 250px; 
            position: fixed;
            z-index: 50; 
            top: 0;
            left: 0;
            background-color: var(--medium-brown);
            overflow-x: hidden;
            transition: transform var(--transition-speed);
            padding-top: 60px;
            transform: translateX(-250px); 
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        #sidebar-menu.active {
            transform: translateX(0); 
        }

        #sidebar-menu a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 1.2em;
            color: white;
            display: block;
            transition: background-color 0.3s;
        }

        #sidebar-menu a:hover {
            background-color: var(--dark-brown);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 36px;
            color: white;
        }

        /* --- Konten Utama --- */
        .content-box {
            background-color: rgba(255, 255, 255, 0.85); 
            max-width: 850px;
            margin: 40px auto 20px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .web-title {
            font-size: 3.5em;
            color: var(--dark-brown);
            margin-bottom: 5px;
        }

        .tagline {
            font-style: italic;
            font-size: 1.1em;
            color: var(--medium-brown);
            margin-top: 0;
            margin-bottom: 30px;
        }

        .ayat-alkitab {
            background-color: var(--soft-brown);
            padding: 15px;
            border-left: 5px solid var(--medium-brown);
            margin: 30px 0;
            font-style: italic;
            font-size: 1.1em;
            color: var(--text-color);
        }

        /* --- Tombol Utama --- */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        .main-button {
            background-color: var(--medium-brown);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 30px;
            cursor: pointer;
            width: 80%;
            max-width: 350px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .main-button:hover {
            background-color: var(--dark-brown);
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }

        /* --- Bagian Detail / Daftar Nama --- */
        .nama-button-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .nama-button {
            background-color: var(--soft-brown);
            color: var(--text-color);
            border: 1px solid var(--medium-brown);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .nama-button:hover {
            background-color: var(--medium-brown);
            color: white;
        }

        .person-info {
            margin-top: 20px;
            padding: 20px;
            border: 2px solid var(--medium-brown);
            border-radius: 10px;
            text-align: left;
            background-color: white;
        }

        .info-data strong {
            color: var(--dark-brown);
            display: inline-block;
            width: 130px;
        }

        .foto-khusus-btn {
            background-color: var(--dark-brown);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .back-button {
            background: none;
            border: 2px solid var(--dark-brown);
            color: var(--dark-brown);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 30px;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
        
        /* --- Galeri --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin: 20px auto;
        }

        .gallery-grid img {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
            object-fit: cover;
            border: 4px solid var(--soft-brown);
        }
        
        /* Lightbox CSS tetap sama */
        .lightbox {
            display: none; 
            position: fixed;
            z-index: 1000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.95);
        }

        .lightbox-content {
            margin: auto;
            display: block;
            width: 90%;
            max-width: 800px;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <div id="sidebar-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">&times;</a>
        <a href="#" id="home-link">🏡 Home</a>
        <a href="#" id="gallery-link">🖼️ Galeri Kebersamaan</a>
    </div>

    <div class="page-content" id="page-content">

        <header>
            <div class="menu-icon" onclick="openMenu()">&#x22EE;</div>
            <h3 style="margin: 0; line-height: 1; margin-left: 15px;">Keluarga Ginting</h3>
        </header>

        <main>
            <section id="home-section" class="content-box">
                <div id="main-content-home">
                    <h1 class="web-title">Keluarga Ginting</h1>
                    <p class="tagline">Kasih, Kesetiaan, dan Kerukunan</p>
                    
                    <div class="ayat-alkitab">
                        "Tetapi aku dan seisi rumahku, kami akan beribadah kepada TUHAN!"<br>
                        — **Yosua 24:15b**
                    </div>

                    <div class="button-container" id="main-buttons">
                        <button class="main-button" onclick="showCategory('kempu')">Kempu Bolang Tigan</button>
                    </div>
                </div>
            </section>

            <section id="detail-section" class="content-box hidden">
                <h2 id="detail-title"></h2>
                <div id="detail-content">
                    </div>
            </section>

            <section id="gallery-section" class="content-box hidden">
                <h2>🖼️ Galeri Kebersamaan Keluarga</h2>
                <p>Momen-momen indah yang kami abadikan.</p>
                <div class="gallery-grid">
                    <img src="https://via.placeholder.com/200/B7A082/FFFFFF?text=Family+Gathering" alt="Kumpul Keluarga Besar Natal 2023" onclick="openLightbox(this)">
                    <img src="https://via.placeholder.com/200/5D4037/FFFFFF?text=Liburan+Toba" alt="Liburan di Danau Toba 2024" onclick="openLightbox(this)">
                    <img src="https://via.placeholder.com/200/EADDCA/5D4037?text=Acara+Adat" alt="Acara Adat Pernikahan" onclick="openLightbox(this)">
                    <img src="https://via.placeholder.com/200/B7A082/FFFFFF?text=Ulang+Tahun+Kempu" alt="Pesta Ulang Tahun Kempu Bunga" onclick="openLightbox(this)">
                </div>
                <button class="back-button" onclick="goHome()">&#x2190; Kembali ke Home</button>
            </section>
        </main>
        
        <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
            <span class="close">&times;</span>
            <img class="lightbox-content" id="lightbox-img">
            <div id="lightbox-caption"></div>
        </div>

    </div> <script>
        // --- Data Keluarga ---
        // Catatan: Data Bolang Tigan dan Anak-Anak tetap ada di sini
        // karena Anda mungkin memerlukannya untuk tombol kembali atau galeri di masa depan,
        // meskipun tombol di halaman utama dihilangkan.
        const familyData = {
            'bolang-tigan': [
                { nama: 'Bolang Edisa Ginting', lahir: '1 Januari 1950', info: 'Kepala keluarga, memiliki semangat pelayanan yang tinggi.', foto: 'https://via.placeholder.com/400/5D4037/FFFFFF?text=Foto+Bolang' },
                { nama: 'Tigan Beru Tarigan', lahir: '5 Mei 1955', info: 'Istri yang setia dan pandai memasak, pilar doa keluarga.', foto: 'https://via.placeholder.com/400/B7A082/FFFFFF?text=Foto+Tigan' }
            ],
            'anak': [
                { nama: 'Anak A Ginting', lahir: '10 Oktober 1980', info: 'Anak pertama, berprofesi sebagai guru SMA di Medan.', foto: 'https://via.placeholder.com/400/EADDCA/5D4037?text=Foto+Anak+A' },
                { nama: 'Anak B Ginting', lahir: '15 November 1985', info: 'Anak kedua, seorang wiraswasta yang sukses di bidang kuliner.', foto: 'https://via.placeholder.com/400/B7A082/FFFFFF?text=Foto+Anak+B' }
            ],
            'kempu': [
                { nama: 'Ekkel Gunanta Ginting', lahir: '16 Febuari 2001', info: "?", foto: 'https://via.placeholder.com/400/5D4037/FFFFFF?text=Foto+Kempu+C' },
                { nama: 'Ananta AG Ginting', lahir: '14 September 2003',infor: "?", foto: 'https://via.placeholder.com/400/EADDCA/5D4037?text=Foto+Kempu+D' },
              {nama: 'Alexanco Egrinta ginting', lahir: '13 desember 2005',infor: "?", foto: 'https://via.placeholder.com/400/EADDCA/5D4037?text=Foto+Kempu+D' },
             { nama: 'Rima Enjelita Br Ginting', lahir: '28 Agustus 2007',infor: "?", foto: 'https://via.placeholder.com/400/EADDCA/5D4037?text=Foto+Kempu+D' },
             { nama: 'Ateta Anastasya Br Ginting', lahir: '28 Desember 2009',infor: "?", foto: 'https://via.placeholder.com/400/EADDCA/5D4037?text=Foto+Kempu+D' },
             { nama: 'Oryza Pranantha Ginting', lahir: '26 April 2010',infor: "?", foto: 'https://via.placeholder.com/400/EADDCA/5D4037?text=Foto+Kempu+D' },
            { nama: 'Inggrid Waterya Br Ginting', lahir: '28 Mei 2013',infor: "?", foto: 'https://via.placeholder.com/400/EADDCA/5D4037?text=Foto+Kempu+D' },
           
            
            ]
        };

        // --- Elemen DOM ---
        const homeSection = document.getElementById('home-section');
        const detailSection = document.getElementById('detail-section');
        const detailTitle = document.getElementById('detail-title');
        const detailContent = document.getElementById('detail-content');
        const gallerySection = document.getElementById('gallery-section');
        const sidebarMenu = document.getElementById('sidebar-menu');
        const pageContent = document.getElementById('page-content');
        
        // --- Fungsi Sidebar Menu ---
        function openMenu() {
            sidebarMenu.classList.add('active');
            pageContent.classList.add('menu-open');
        }

        function closeMenu() {
            sidebarMenu.classList.remove('active');
            pageContent.classList.remove('menu-open');
        }

        // --- Navigasi Inti ---
        function hideAllSections() {
            homeSection.classList.add('hidden');
            detailSection.classList.add('hidden');
            gallerySection.classList.add('hidden');
        }

        function showCategory(category) {
            hideAllSections();
            detailSection.classList.remove('hidden');

            const categoryName = category.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' & ');
            detailTitle.textContent = 'Daftar Anggota ' + categoryName;
            
            // Buat daftar tombol nama
            let html = '<div class="nama-button-grid">';
            html += familyData[category].map(person => 
                // Mengganti karakter kutip tunggal dalam nama untuk mencegah error JS
                `<button class="nama-button" onclick="showPersonDetail('${category}', '${person.nama.replace(/'/g, "\\'")}')">${person.nama}</button>`
            ).join('');
            html += '</div>';
            
            html += '<button class="back-button" onclick="goHome()">&#x2190; Kembali ke Home</button>';
            detailContent.innerHTML = html;
        }

        function showPersonDetail(category, name) {
            const person = familyData[category].find(p => p.nama === name);

            if (!person) return;
            
            detailContent.innerHTML = `
                <div class="person-info">
                    <h3>${person.nama}</h3>
                    <div class="info-data">
                        <p><strong>Tanggal Lahir:</strong> ${person.lahir}</p>
                        <p><strong>Informasi:</strong> ${person.info}</p>
                    </div>
                    <button class="foto-khusus-btn" onclick="openLightbox({src:'${person.foto}', alt:'Foto Khusus ${person.nama}'})">📷 Lihat Foto Khusus</button>
                </div>
                <button class="back-button" style="margin-top: 30px;" onclick="showCategory('${category}')">&#x2190; Kembali ke Daftar Nama</button>
            `;
        }
        
        function goHome() {
            hideAllSections();
            homeSection.classList.remove('hidden');
        }
        
        // --- Fungsionalitas Lightbox Pop-up ---
        function openLightbox(element) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const captionText = document.getElementById('lightbox-caption');

            lightbox.style.display = "block";
            
            if (element.src && typeof element.src === 'string') {
                lightboxImg.src = element.src;
                captionText.innerHTML = element.alt;
            } else { 
                lightboxImg.src = element.getAttribute('src');
                captionText.innerHTML = element.getAttribute('alt');
            }
        }

        function closeLightbox(event) {
            // Hanya tutup jika mengklik tombol close atau area hitam lightbox
            if (event.target.id === 'lightbox' || event.target.className === 'close') {
                document.getElementById('lightbox').style.display = "none";
            }
        }
        
        // --- Event Listener Navigasi Sidebar ---
        document.getElementById('home-link').onclick = (e) => {
            e.preventDefault();
            closeMenu();
            goHome(); 
        };

        document.getElementById('gallery-link').onclick = (e) => {
            e.preventDefault();
            closeMenu();
            hideAllSections();
            gallerySection.classList.remove('hidden');
        };

        // Tutup menu jika user klik di luar sidebar saat menu terbuka (Overlay functionality)
        pageContent.onclick = function(e) {
             if (sidebarMenu.classList.contains('active') && !e.target.closest('#sidebar-menu') && !e.target.closest('.menu-icon')) {
                closeMenu();
            }
        };

    </script>
</body>
</html>
